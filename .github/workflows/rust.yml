name: Rust Multiplatform Build & Release

on:
  push:
    tags:
      - 'v*'  # Solo se dispara en tags como v1.0, v1.1, etc.

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      # Linux build
      - run: cargo build --release
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false

      # Upload Linux binary
      - uses: actions/upload-release-asset@v2
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: target/release/rust-test
          asset_name: rust-test-linux
          asset_content_type: application/octet-stream

      # Windows build
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      - run: cargo build --release --target x86_64-pc-windows-gnu
      - uses: actions/upload-release-asset@v2
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: target/x86_64-pc-windows-gnu/release/rust-test.exe
          asset_name: rust-test-windows.exe
          asset_content_type: application/octet-stream

      # Mac build
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      - run: cargo build --release --target x86_64-apple-darwin
      - uses: actions/upload-release-asset@v2
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: target/x86_64-apple-darwin/release/rust-test
          asset_name: rust-test-mac
          asset_content_type: application/octet-stream
